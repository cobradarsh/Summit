# Builds the roothide .deb on GitHub-hosted Macs. Download it from the run's "Artifacts" section.
#
# Xcode's clang is required: it emits the arm64e ABI that iOS 14+ loads into SpringBoard.
# (The Linux iOS toolchain's clang 11 only emits the old arm64e ABI, which SpringBoard rejects.)
# Hosted Mac capacity is often short, so several Mac types build in parallel; any one result is enough.
name: Build Summit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          path: Summit

      - name: Install build tools
        run: brew install make xz ldid dpkg

      - name: Install roothide Theos and iOS 16.5 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip "sdks-master/iPhoneOS16*" -d sdks
          mkdir -p "$THEOS/sdks"
          mv sdks/sdks-master/* "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build package
        working-directory: Summit
        run: gmake clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: Summit-deb-${{ matrix.runner }}
          path: Summit/packages/*.deb
