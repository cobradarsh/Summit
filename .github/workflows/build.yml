# Builds the roothide .deb on a GitHub-hosted Linux machine. Download it from the run's "Artifacts" section.
# Mirrors the Linux path of roothide's install-theos script, with the iOS 16.5 SDK pinned.
name: Build Summit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          path: Summit

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip git libxml2 libtinfo6 xz-utils

      - name: Install roothide Theos and iOS toolchain
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$THEOS/toolchain/"
          BIN="$THEOS/toolchain/linux/iphone/bin"
          if [ ! -x "$BIN/ldid" ]; then
            curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o "$BIN/ldid"
            chmod +x "$BIN/ldid"
          fi
          "$BIN/clang" --version

      - name: Install iOS 16.5 SDK
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o sdks.zip
          unzip -q sdks.zip "sdks-master/iPhoneOS16*" -d sdks
          mv sdks/sdks-master/* "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build package
        working-directory: Summit
        run: make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: Summit-deb
          path: Summit/packages/*.deb
